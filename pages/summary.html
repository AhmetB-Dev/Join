<!DOCTYPE html>
<html lang="en" class="page-summary">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="../assets/img/capa.png" type="image/png" />

  <link rel="stylesheet" href="../styles/standard.css" />
  <link rel="stylesheet" href="../styles/header.css" />
  <link rel="stylesheet" href="../styles/side-menu.css" />
  <link rel="stylesheet" href="../styles/profile-dropdown.css" />
  <link rel="stylesheet" href="../styles/task.css" />
  <link rel="stylesheet" href="../styles/summary.css" />
  <link rel="stylesheet" href="../styles/summary-responsive.css">

  <script src="../scripts/api.js"></script>
  <script src="../scripts/dropdown.js"></script>
  <script src="../scripts/summary.js" defer></script>

  <title>Join</title>
</head>

<body>
  <div class="side-menu">
    <div class="logo-content-container">

      <div class="logo-container-side-menu-responsive">
        <img src="../assets/img/capa_white.png" alt="Join.Logo" class="logo" />
      </div>
      <div class="menu-content">
        <div class="selected-menu">
          <a href="./summary.html" id="summary-menu">
            <img src="../assets/img/icon/summary.png" alt="summary" />Summary
          </a>
        </div>
        <div class="menu-content-div">
          <a id="task-menu" href="./add_task.html">
            <img src="../assets/img/icon/add_task.png" alt="add task">
            Add Task
          </a>
        </div>
        <div class="menu-content-div resp-cont-div">
          <a href="./board.html">
            <img src="../assets/img/icon/board.png" alt="board" />Board
          </a>
        </div>
        <div class="menu-content-div">
          <a href="./contacts.html">
            <img src="../assets/img/icon/contacts.png" alt="contacts" />Contacts
          </a>
        </div>
      </div>
    </div>
    <div class="policy-container">
      <div class="policy-container-div">
        <div>
          <a href="./privacy-policy.html">Privacy Policy</a>
        </div>
        <div>
          <a href="./legal-notice.html">Legal Notice</a>
        </div>
      </div>
    </div>
  </div>
  <div class="main-div">
    <div class="header">
      <div class="main-header">
        <div class="header-logo-none-resp">
          <img class="header-Logo" src="../assets/img/capa.png" alt />
        </div>
        <div class="headline-header">Kanban Project Management Tool</div>
        <div class="header-right-side">
          <div>
            <a href="./help.html">
              <img src="../assets/img/icon/help.png" alt="" class="help-icon" />
            </a>
          </div>
          <div class="account">
            <div>##</div>
          </div>
        </div>
      </div>
    </div>
     <div class="dropdown-menu">
      <div class="dropdown-content">
        <div class="dropdown-content-div">
          <a class="held-link" href="./help.html">Help</a>
        </div>
        <div class="dropdown-content-div">
          <a class="resources-link" href="./legal-notice.html">Legal notice</a>
        </div>
        <div class="dropdown-content-div">
          <a class="resources-link" href="./privacy-policy.html">Privacy Policy</a>
        </div>
        <div class="dropdown-content-div" onclick="logout()">
          <a class="resources-link" href="../index.html">Logout</a>
        </div>
      </div>
    </div>
    <!-- summary -->
    <div class="summary">
      <!-- HEADER -->
      <header class="summary-header">
        <h2 class="summary-title">Join 360</h2>
        <img class="summary-divider" src="../assets/img/summary-space-line.svg" alt="">
        <p class="summary-subtitle">Key Metrics at a Glance</p>
      </header>

      <!-- MAIN CONTENT -->
      <div class="summary-content">
        <div class="summary-metrics">
          <section class="summary-row">
            <button onclick="window.location.href='./board.html'"
              class="summary-card-design summary-card todo v-stack">
              <div class="icon-todo"></div>
              <div class="js-count-container">
                <span class="value counter-design">0</span>
                <span class="counter-text-design">To-do</span>
              </div>
            </button>
            <button onclick="window.location.href='./board.html'"
              class="summary-card-design summary-card done v-stack">
              <div class="icon-done"></div>
              <div class="js-count-container">
                <span class="value counter-design">0</span>
                <span class="counter-text-design">Done</span>
              </div>
            </button>
          </section>

          <div class="summary-row">
            <button onclick="window.location.href='./board.html'"
              class="v-stack summary-card-design summary-card urgent deadline">
              <div class="deadline-container">
                <img class="img-urgent-summary" src="../assets/img/urgent-summary.png" alt="">
                <div class="js-urgent-container">
                  <span class="value counter-design">0</span>
                  <span class="label">Urgent</span>
                </div>
                <img class="urgent-line-padding" src="../assets/img/urgent_line.svg" alt="space line">
                <div class="deadline-under-container">
                  <span class="date js-deadline-date">October 16, 2022</span>
                  <span class="label">Upcoming Deadline</span>
                </div>
              </div>
            </button>
          </div>

          <div class="summary-row">
            <button onclick="window.location.href='./board.html'" class="summary-card-design summary-card">
              <div class="js-count-container">
                <span class="value counter-design">0</span>
                <span class="counter-text-design">Tasks in <br> Board</span>
              </div>
            </button>
            <button onclick="window.location.href='./board.html'" class="summary-card-design summary-card">
              <div class="js-count-container">
                <span class="value counter-design">0</span>
                <span class="counter-text-design">Tasks In <br> Progress</span>
              </div>
            </button>
            <button onclick="window.location.href='./board.html'" class="summary-card-design summary-card">
              <div class="js-count-container">
                <span class="value counter-design">0</span>
                <span class="counter-text-design">Awaiting <br> Feedback</span>
              </div>
            </button>
          </div>
        </div>

        <!-- welcome summary name-->
        <div class="summary-greeting">
          <p class="welcome-summary js-greeting">Good morning!</p>
          <h2 class="summary-name js-user-name"></h2>
        </div>

      </div>
    </div>

    <div class="side-menu-bottom">
      <div class="logo-content-container-bottom">
        <div class="menu-content-bottom">
          <div class="selected-menu bottom-menu">
            <a href="./summary.html">
              <img src="../assets/img/icon/summary.png" alt="summary" />Summary
            </a>
          </div>
          <div class="menu-content-div bottom-menu">
            <a href="./add_task.html">
              <img src="../assets/img/icon/add_task.png" alt="add task">
              Add Task
            </a>
          </div>
          <div class="menu-content-div resp-cont-div bottom-menu">
            <a href="./board.html">
              <img src="../assets/img/icon/board.png" alt="board" />Board
            </a>
          </div>
          <div class="menu-content-div bottom-menu">
            <a href="./contacts.html">
              <img src="../assets/img/icon/contacts.png" alt="contacts" />Contacts
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
